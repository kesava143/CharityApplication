<!DOCTYPE html>
<html xmlns:th='http://www.thymeleaf.org'>

<head>
	<meta charset='UTF-8'>
	<title>Certificate Preview</title>
	<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
</head>

<body>
	<div class='container mt-4'>
		<div class='card'>
			<div class='card-header bg-primary text-white'>
				<h3>Certificate Preview</h3>
			</div>
			<div class='card-body'>
				<p>Total Contacts: <span th:text='${totalContacts}'>0</span></p>
				<div th:text='${message}'></div>
				<table class='table'>
					<thead>
						<tr>
							<th>#</th>
							<th>Name</th>
							<th>Mobile</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each='contact,stat:${contacts}'>
							<td th:text='${stat.count}'>1</td>
							<td th:text='${contact.name}'>Name</td>
							<td th:text='${contact.mobile}'>Mobile</td>
						</tr>
					</tbody>
				</table><button onclick='history.back()' class='btn btn-secondary'>Back</button>
				<form action='/generate-certificates' method='post' style='display:inline'><button
						class='btn btn-primary'>Generate Certificates</button></form>
				<form action='/generate-send-certificates' method='post' style='display:inline'><button
						class='btn btn-success'>Generate & Send</button></form>
			</div>
		</div>
	</div>
</body>

</html>
