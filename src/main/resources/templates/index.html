<!DOCTYPE html>
<html lang="en">
<head>
    <title>Helping Hearts Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>

        }

        .resend a {

        }
		
		.logo {
		            text-align: center;
		            margin-bottom: 1spx;
		        }

		        .logo img {
		            width: 100px;
		            height: 100px;
		            border-radius: 50%;
		            background: white;
		            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
		        }
				/* Background image blur */
				        body::before {
				            content: "";
				            position: fixed;
				            width: 100%;
				            height: 100%;
				            background: url("/LogoMain.jpg") no-repeat center center/cover;
				            filter: blur(6px);
				            transform: scale(1.08);
				            z-index: -2;
				        }
						

						#loader {
						    position: fixed;
						    width: 100%;
						    height: 100%;
						    background: rgba(0,0,0,0.6);
						    display: none;
						    justify-content: center;
						    align-items: center;
						    z-index: 999;
						}

						/* Container */
						.logo-loader {
						    position: relative;
						    width: 100px;
						    height: 100px;
						}

						/* Logo (STATIC) */
						.logo-loader img {
						    width: 100%;
						    height: 100%;
						    border-radius: 50%;
						    position: absolute;
						    z-index: 2;
						    background: white;
						}

						/* Rotating Ring */
						.ring {
						    position: absolute;
						    width: 120px;
						    height: 120px;
						    top: -14px;
						    left: -14px;
						    right: -10px;
						    bottom: -10px;
						    border-radius: 50%;

						    border: 4px solid transparent;
						    border-top: 4px solid #ff416c;
						    border-right: 4px solid #1d4ed8;
						    border-left: 4px solid rgb(0, 255, 0);
						    border-bottom: 4px solid rgb(255, 0, 255);

						    animation: rotateRing 1s linear infinite;
						}

						/* Rotation Animation */
						@keyframes rotateRing {
						    from { transform: rotate(0deg); }
						    to { transform: rotate(360deg); }
						}
						
						.ring {
						    box-shadow: 0 0 15px rgba(255,65,108,0.8);
						}
						
						#loader img {
						    animation: spin 1.2s linear infinite, glow 1.5s ease-in-out infinite alternate;
						}

						@keyframes glow {
						    from { box-shadow: 0 0 10px rgba(255,255,255,0.6); }
						    to { box-shadow: 0 0 30px rgba(255,255,255,1); }
						}	
						
						.otp-input {
						    width: 35px;
						    height: 35px;
						    text-align: center;
						    font-size: 22px;
						    border-radius: 10px;
						    
						    border: 2px solid #ff4b2b;   /* 🔴 RED BORDER */

						    outline: none;
						    transition: 0.3s;
						}
						
						.otp-input:focus {
						    border-color: #ff416c;
						    box-shadow: 0 0 10px rgba(255,65,108,0.8);

<div id="loader">

    </div>
</div>

<body>

<font class="box">
	<div class="logo">
	            <img src="/LogoMain.jpg" alt="Helping Hearts Logo">
	        </div>
    <font color="red"><h2 >Helping Hearts And Supporting Hands Charitable Trust <br> Login</h2></font>

    <!-- USERNAME -->
    <input type="text" id="username" placeholder="Enter Username" required>

    <button onclick="sendOtp()">Send OTP</button>

    <!-- OTP SECTION -->
    <div id="otpSection">

        <div class="otp-box">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
            <input maxlength="1" class="otp-input">
        </div>

        <button onclick="verifyOtp()">Verify OTP</button>

        <div class="resend">
            <span id="timer">Resend in 30s</span>
            <a href="#" id="resendBtn" onclick="resendOtp()" style="display:none;">Resend OTP</a>
        </div>

    </div>

</div>

<script>

let inputs = document.querySelectorAll(".otp-input");

/* AUTO INPUT */
inputs.forEach((input, index) => {

    input.addEventListener("input", () => {

        input.value = input.value.replace(/[^0-9]/g, '');

        if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }

        checkAutoSubmit();
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
        }
    });

});

/* SEND OTP */
function sendOtp() {

    let username = document.getElementById("username").value;

    if (!username) {
        alert("Enter username");
        return;
    }else{
		// To make it read-only
		document.getElementById("username").readOnly = true;
	}

    // SHOW LOADER
    document.getElementById("loader").style.display = "flex";

    fetch("/send-otp", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "username=" + username
    })
    .then(res => res.text())
    .then(data => {

        document.getElementById("loader").style.display = "none";

        if (data === "OTP_SENT") {
            document.getElementById("otpSection").style.display = "block";
            startTimer();
        } else {
            alert("User not found");
        }
    })
    .catch(() => {
        document.getElementById("loader").style.display = "none";
        alert("Error sending OTP");
    });
}

/* VERIFY OTP */
function verifyOtp() {

    let otp = "";
    inputs.forEach(i => otp += i.value);

    let username = document.getElementById("username").value;

    if (otp.length !== 6) {
        alert("Enter complete OTP");
        return;
    }

    let form = document.createElement("form");
    form.method = "POST";
    form.action = "/verify-otp";

    form.innerHTML =
        `<input name="username" value="${username}">
         <input name="otp" value="${otp}">`;

    document.body.appendChild(form);
    form.submit();
}

/* AUTO SUBMIT */
function checkAutoSubmit() {
    let otp = "";
    inputs.forEach(i => otp += i.value);

    if (otp.length === 6) {
        verifyOtp();
    }
}

/* TIMER */
let timeLeft = 30;

function startTimer() {

    let timer = document.getElementById("timer");
    let resendBtn = document.getElementById("resendBtn");

    timer.style.display = "block";
    resendBtn.style.display = "none";

    let interval = setInterval(() => {

        timeLeft--;
        timer.innerText = "Resend in " + timeLeft + "s";

        if (timeLeft <= 0) {
            clearInterval(interval);
            timer.style.display = "none";
            resendBtn.style.display = "inline";
        }

    }, 1000);
}

/* RESEND OTP */
function resendOtp() {
    timeLeft = 30;
    sendOtp();
}

</script>

</body>
</html>
