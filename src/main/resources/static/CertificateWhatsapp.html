<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>WhatsApp Certificate Sender</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>WhatsApp Certificate Sender</h3>

</div>

<div class="card-body">

<form method="post"
      enctype="multipart/form-data"
      action="/certificate-preview">

<div class="mb-3">

<label class="form-label">

Select Excel File

</label>

<input
type="file"
class="form-control"
name="excel"
accept=".xls,.xlsx"
required>

</div>

<div class="mb-3">

<label class="form-label">

Select Excel Date

</label>

<input
    type="text"
    id="certificateDate"
    name="certificateDate"
    class="form-control">

<script>
flatpickr("#certificateDate", {
    dateFormat: "d-M-Y"
});
</script>

</div>

<div class="mb-3">

<label class="form-label">

Static WhatsApp Message

</label>

<textarea
class="form-control"
rows="6"
name="message"
required></textarea>

</div>

<button class="btn btn-success">

Preview Contacts

</button>

</form>

</div>

</div>

</div>

</body>

</html>
