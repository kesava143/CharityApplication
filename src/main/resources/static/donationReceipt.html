<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Donation Receipt Generator</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet">

<link rel="stylesheet" href="/css/donationReceipt.css">



</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                <i class="fa-solid fa-hand-holding-heart"></i>

                Donation Receipt Generator

            </h3>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">

                    <label class="form-label">

                        Select Excel File

                    </label>

                    <input

                            id="excelFile"

                            class="form-control"

                            type="file"

                            accept=".xls,.xlsx">

                </div>

                <div class="col-md-3">

                    <label class="form-label">

                        Output Format

                    </label>

                    <select

                            id="outputType"

                            class="form-select">

                        <option value="JPG">

                            JPG

                        </option>

                        <option value="PNG">

                            PNG

                        </option>

                        <option value="PDF">

                            PDF

                        </option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label class="form-label">

                        &nbsp;

                    </label>

                    <div class="form-check">

                        <input

                                class="form-check-input"

                                id="sendWhatsapp"

                                checked

                                type="checkbox">

                        <label

                                class="form-check-label">

                            Send WhatsApp

                        </label>

                    </div>

                </div>

            </div>

            <hr>

            <div class="text-center">

                <button

                        id="uploadBtn"

                        class="btn btn-success">

                    <i class="fa fa-upload"></i>

                    Upload Excel

                </button>

                <button

                        id="generateBtn"

                        class="btn btn-primary">

                    <i class="fa fa-play"></i>

                    Generate

                </button>

                <button

                        id="cancelBtn"

                        class="btn btn-warning">

                    Cancel

                </button>

                <button

                        id="resetBtn"

                        class="btn btn-danger">

                    Reset

                </button>

            </div>

            <hr>

            <h5>

                Progress

            </h5>

            <div class="progress">

                <div

                        id="progressBar"

                        class="progress-bar progress-bar-striped progress-bar-animated"

                        style="width:0%">

                    0%

                </div>

            </div>

            <br>

            <div class="row text-center">

                <div class="col">

                    <div class="card">

                        <div class="card-body">

                            <h6>Total</h6>

                            <h3 id="total">

                                0

                            </h3>

                        </div>

                    </div>

                </div>

                <div class="col">

                    <div class="card">

                        <div class="card-body">

                            <h6>Completed</h6>

                            <h3 id="completed">

                                0

                            </h3>

                        </div>

                    </div>

                </div>

                <div class="col">

                    <div class="card">

                        <div class="card-body">

                            <h6>Success</h6>

                            <h3 id="success">

                                0

                            </h3>

                        </div>

                    </div>

                </div>

                <div class="col">

                    <div class="card">

                        <div class="card-body">

                            <h6>Failed</h6>

                            <h3 id="failed">

                                0

                            </h3>

                        </div>

                    </div>

                </div>

            </div>

            <hr>

            <div class="alert alert-info">

                <h5>

                    Current Processing

                </h5>

                <p>

                    <b>Name :</b>

                    <span id="currentName">

                        -

                    </span>

                </p>

                <p>

                    <b>Mobile :</b>

                    <span id="currentMobile">

                        -

                    </span>

                </p>

                <p>

                    <b>Status :</b>

                    <span id="currentStatus">

                        Waiting...

                    </span>

                </p>

            </div>

        </div>

    </div>

</div>

<script src="/js/donationReceipt.js"></script>

</body>

</html>
